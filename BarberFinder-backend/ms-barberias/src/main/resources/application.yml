server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ms-barberias
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:barber_barberias}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
    username: ${DB_USER:barber}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    time-zone: America/Santiago

app:
  jwt:
    secret: ${JWT_SECRET}
  seed:
    enabled: ${SEED_ENABLED:true}
    dueno-id: ${SEED_DUENO_ID:2}
